# No Java: a vehicle for Vanilla Wheels is a datapack entry, a mesh and a texture.
modLoader="lowcodefml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/the-rusty-shackleford/minecraft-iron-horse/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Chunkworks"
description='''
The Iron Horse: a vintage motorcycle for Vanilla Wheels. A rider and a
pillion, a headlamp, a kickstand it leans on parked, and it jumps as a
ridden horse does: hold the jump key, watch the bar fill, let go.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The protocol, nested in this jar. 1.19.0 is the first that jumps, leans and turns a bike's own wheels.
[[dependencies.${mod_id}]]
    modId="vanillawheels"
    type="required"
    versionRange="[1.19.0,2.0)"
    ordering="AFTER"
    side="BOTH"
